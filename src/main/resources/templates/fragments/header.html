<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Custom Book Store'">Custom Book Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<nav th:fragment="navbar" class="navbar">
    <div class="navbar-container">
        <a href="/" class="navbar-brand">
            <span class="brand-icon">📚</span>
            <span class="brand-text">CustomBooks</span>
        </a>

        <ul class="navbar-menu">
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/books}">Browse Books</a></li>
            <li><a th:href="@{/about}">About</a></li>
            <li><a th:href="@{/contact}">Contact</a></li>
        </ul>

        <div class="navbar-actions">
            <div sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-outline">Login</a>
                <a th:href="@{/register}" class="btn btn-primary">Register</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="user-menu">
                <a th:href="@{/cart}" class="cart-link">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-text">Cart</span>
                </a>

                <div class="dropdown">
                    <button class="dropdown-toggle">
                        <span class="user-icon">👤</span>
                        <span sec:authentication="name">User</span>
                    </button>
                    <div class="dropdown-menu">
                        <a th:href="@{/profile}">My Profile</a>
                        <a th:href="@{/orders}">My Orders</a>
                        <div sec:authorize="hasRole('ADMIN')">
                            <hr>
                            <a th:href="@{/admin}">Admin Panel</a>
                        </div>
                        <hr>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="logout-btn">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
</html>
