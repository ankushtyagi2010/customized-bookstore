<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Checkout')}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <main class="main-content">
        <div class="container">
            <h1>Checkout</h1>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <div class="checkout-container">
                <form th:action="@{/orders/checkout}" th:object="${shippingAddress}" method="post" class="checkout-form">
                    <div class="checkout-section">
                        <h2>Shipping Address</h2>

                        <!-- Saved Addresses -->
                        <div th:if="${addresses != null and !addresses.isEmpty()}" class="saved-addresses">
                            <h4>Use a saved address:</h4>
                            <div class="address-options">
                                <div th:each="addr : ${addresses}" class="address-option">
                                    <input type="radio" th:id="'addr-' + ${addr.id}"
                                           name="savedAddress" th:value="${addr.id}"
                                           onclick="fillAddress(this)">
                                    <label th:for="'addr-' + ${addr.id}">
                                        <strong th:text="${addr.label}">Home</strong><br>
                                        <span th:text="${addr.street}">123 Main St</span><br>
                                        <span th:text="${addr.city} + ', ' + ${addr.state} + ' ' + ${addr.zipCode}">City, State ZIP</span>
                                    </label>
                                </div>
                            </div>
                            <p class="or-divider">Or enter a new address:</p>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="fullName">Full Name *</label>
                                <input type="text" id="fullName" th:field="*{fullName}" required class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="street">Street Address *</label>
                            <input type="text" id="street" th:field="*{street}" required class="form-control"
                                   placeholder="123 Main Street">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" th:field="*{city}" required class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="state">State *</label>
                                <input type="text" id="state" th:field="*{state}" required class="form-control">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="zipCode">ZIP Code *</label>
                                <input type="text" id="zipCode" th:field="*{zipCode}" required class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="country">Country *</label>
                                <select id="country" th:field="*{country}" required class="form-control">
                                    <option value="US">United States</option>
                                    <option value="CA">Canada</option>
                                    <option value="UK">United Kingdom</option>
                                    <option value="AU">Australia</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" th:field="*{phone}" class="form-control"
                                   placeholder="(555) 123-4567">
                        </div>
                    </div>

                    <div class="checkout-section">
                        <h2>Order Summary</h2>
                        <div class="order-summary">
                            <div class="summary-row">
                                <span>Subtotal</span>
                                <span th:text="'$' + ${cartTotal}">$24.99</span>
                            </div>
                            <div class="summary-row">
                                <span>Shipping</span>
                                <span>FREE</span>
                            </div>
                            <div class="summary-row">
                                <span>Tax</span>
                                <span>$0.00</span>
                            </div>
                            <div class="summary-row total">
                                <span>Total</span>
                                <span th:text="'$' + ${cartTotal}">$24.99</span>
                            </div>
                        </div>
                    </div>

                    <div class="checkout-actions">
                        <a th:href="@{/cart}" class="btn btn-outline">Back to Cart</a>
                        <button type="submit" class="btn btn-primary btn-large">
                            Place Order
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:inline="javascript">
        const addresses = [[${addresses}]];

        function fillAddress(radio) {
            const addrId = radio.value;
            const addr = addresses.find(a => a.id === addrId);
            if (addr) {
                document.getElementById('fullName').value = addr.label || '';
                document.getElementById('street').value = addr.street || '';
                document.getElementById('city').value = addr.city || '';
                document.getElementById('state').value = addr.state || '';
                document.getElementById('zipCode').value = addr.zipCode || '';
                document.getElementById('country').value = addr.country || 'US';
            }
        }
    </script>
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
