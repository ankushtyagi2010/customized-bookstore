<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Edit Character')}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <main class="main-content admin-layout">
        <aside class="admin-sidebar">
            <nav class="admin-nav">
                <a th:href="@{/admin}" class="admin-nav-item">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
                <a th:href="@{/admin/books}" class="admin-nav-item">
                    <span class="nav-icon">📚</span> Book Templates
                </a>
                <a th:href="@{/admin/characters}" class="admin-nav-item active">
                    <span class="nav-icon">🎨</span> Characters
                </a>
                <a th:href="@{/admin/orders}" class="admin-nav-item">
                    <span class="nav-icon">📦</span> Orders
                </a>
                <a th:href="@{/admin/users}" class="admin-nav-item">
                    <span class="nav-icon">👥</span> Users
                </a>
            </nav>
        </aside>

        <div class="admin-content">
            <div class="admin-header">
                <h1 th:text="${character.id != null} ? 'Edit Character' : 'Add New Character'">Character</h1>
            </div>

            <form th:action="@{/admin/characters/save}" th:object="${character}" method="post"
                  enctype="multipart/form-data" class="admin-form">

                <input type="hidden" th:field="*{id}">

                <div class="form-section">
                    <h3>Character Information</h3>

                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" th:field="*{name}" required class="form-control"
                               placeholder="e.g., Happy Boy Alex">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                                  placeholder="A cheerful young boy with brown hair..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Category *</label>
                            <select id="category" th:field="*{category}" required class="form-control">
                                <option value="">Select Category</option>
                                <option value="boy">Boy</option>
                                <option value="girl">Girl</option>
                                <option value="animal">Animal</option>
                                <option value="fantasy">Fantasy</option>
                                <option value="adult">Adult</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="style">Style *</label>
                            <select id="style" th:field="*{style}" required class="form-control">
                                <option value="">Select Style</option>
                                <option value="cartoon">Cartoon</option>
                                <option value="realistic">Realistic</option>
                                <option value="anime">Anime</option>
                                <option value="watercolor">Watercolor</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="sortOrder">Sort Order</label>
                        <input type="number" id="sortOrder" th:field="*{sortOrder}" class="form-control" min="0">
                        <small class="form-hint">Lower numbers appear first</small>
                    </div>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" th:field="*{active}">
                            Active (visible to customers)
                        </label>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Character Image</h3>

                    <div th:if="${character.imageUrl != null}" class="current-image">
                        <img th:src="${character.imageUrl}" alt="Current Image" class="preview-image">
                        <p>Current character image</p>
                    </div>

                    <div class="form-group">
                        <label for="imageFile">Upload Image *</label>
                        <input type="file" id="imageFile" name="imageFile" accept="image/*" class="form-control"
                               th:required="${character.id == null}">
                        <small class="form-hint">Recommended: 400x400 pixels, transparent PNG background, Max 5MB</small>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/admin/characters}" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Character</button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
