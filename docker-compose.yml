services:
  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customized-bookstore
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/bookstore
      - APP_UPLOAD_DIR=/app/uploads
    volumes:
      - bookstore-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bookstore-network
    restart: unless-stopped

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: bookstore-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=bookstore
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - bookstore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MongoDB Express (optional - for database management UI)
  mongo-express:
    image: mongo-express:latest
    container_name: bookstore-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bookstore-network
    restart: unless-stopped
    profiles:
      - admin

networks:
  bookstore-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  bookstore-uploads:
    driver: local
